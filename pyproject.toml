[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thenoise"
version = "0.1.2"
description = "Diffusion inference engine targeting ROCm"
requires-python = ">=3.10"
# NOTE: torch is intentionally NOT listed here.
dependencies = [
    # web server
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # model code
    "transformers==4.57.6",
    "safetensors==0.4.5",
    "einops==0.7.0",
    "accelerate==1.6.0",
    "huggingface-hub==0.34.3",
    "pillow>=11.3.0",
    "numpy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools]
packages = [
    "thenoise",
    "thenoise.models",
    "thenoise.dit",
    "thenoise.dit.krea2",
    "thenoise.dit.anima",
    "thenoise.dit.zimage",
    "thenoise.vae",
    "thenoise.upscale",
    "thenoise.utils",
    "thenoise.postprocess",
    "thenoise.ui",
]

[tool.setuptools.package-data]
# Tokenizer configs used by the Anima text encoder (loaded via __file__).
"thenoise.dit.anima" = ["configs/**/*"]
# Committed Sesqui latent upscaler weights (bf16, ~6MB).
"thenoise.upscale" = ["weights/**/*"]
# Web UI served at /
"thenoise.ui" = ["*.html"]
